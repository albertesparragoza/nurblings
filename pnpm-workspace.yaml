packages:
  - packages/*
  - examples/*
  - site
# A newly published version waits a day before installs pick it up: most
# hijacked releases are caught and pulled within that window.
minimumReleaseAge: 1440
allowBuilds:
  esbuild: true
  # Wrangler's local runtime: CI only uploads the built site, so its install
  # script (a binary download) never needs to run
  workerd: false
