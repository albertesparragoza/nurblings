name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: bash -n .githooks/*
      - name: Commit message hook
        run: |
          printf 'feat(seed): add seed normalisation\n' > "$RUNNER_TEMP/ok"
          .githooks/commit-msg "$RUNNER_TEMP/ok"
          printf 'Added some stuff\n' > "$RUNNER_TEMP/bad"
          if .githooks/commit-msg "$RUNNER_TEMP/bad"; then
            echo "commit-msg accepted a non-conventional message"; exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
