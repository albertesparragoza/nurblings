name: release

# Versions are bumped on release/* branches with `pnpm changeset version`.
# When the maintainer merges that release into main, this publishes every
# package whose version is not on npm yet, with provenance, and tags it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm publint
      # pnpm packs (it turns workspace: ranges into real versions) and the npm
      # CLI uploads: pnpm 11's own publish ignored provenance for 1.0.0, while
      # npm signs a provenance statement and also speaks trusted publishing.
      # Each package whose version is not on npm yet is published and tagged.
      # No npm token: every package has this workflow as its trusted publisher,
      # so npm authenticates the run through GitHub's OIDC token (id-token:
      # write above) and signs provenance with it.
      - name: Publish packages not yet on npm
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pack"
          mkdir -p "$out"
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "$dir" && pnpm pack --pack-destination "$out" >/dev/null)
            tarball="$out/$(echo "${name#@}" | tr / -)-$version.tgz"
            npm publish "$tarball" --provenance --access public
            git tag "$name@$version"
          done
      - run: git push origin --tags
